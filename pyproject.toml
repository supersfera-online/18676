[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-phone"
version = "0.1.0"
description = "A STRIPS-style planner-executor for bootstrapping Claude Code on Android via Termux."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Super Sfera LLC" }]
keywords = ["termux", "android", "claude-code", "planner", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Android",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.8",
]

[project.scripts]
claude-phone = "claude_phone.cli:main"

[project.urls]
Repository = "https://github.com/supersfera-online/18676"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_phone"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# The system-prompt template is verbatim copy; wrapping would change its content.
"src/claude_phone/prompt_builder.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["claude_phone"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
